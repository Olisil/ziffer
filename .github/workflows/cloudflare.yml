# Deploys a copy of Probe to Nassau's own Cloudflare account, with the database and files locked to the EU.
# Runs on every change to main, so the Cloudflare deployment always has the same code as the one on Webflow Cloud.
# It can also be started by hand (Actions → Deploy to Cloudflare → Run workflow).
# The live app on Webflow Cloud is not touched by this.
#
# Needs, under Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN (Workers, D1, R2 and KV edit), CLOUDFLARE_ACCOUNT_ID
#   Variables: PUBLIC_CLERK_PUBLISHABLE_KEY (the same publishable key the live app uses)
name: Deploy to Cloudflare (EU)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
      PROBE_TARGET: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash cloudflare/step.sh Install npm ci
      - name: Make sure the EU database, file store and session store exist
        run: node cloudflare/setup.mjs
      - name: Build
        run: bash cloudflare/step.sh Build npm run build
      - name: Bring the database up to date
        run: bash cloudflare/step.sh Database npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: bash cloudflare/step.sh Deploy npx wrangler deploy
